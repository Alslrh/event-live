<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>잘 자</title>
<meta name="theme-color" content="#05060f">
<meta property="og:title" content="잘 자 🌙">
<meta property="og:description" content="불을 끄면 보이는 편지">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Jua&display=swap" rel="stylesheet">
<style>
:root{--warm:#f6dcae;--warm2:#e9b977;--ink:#3b2a1a;--night:#05060f;--star:#fff7e0;--soft:rgba(255,247,224,.72);color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--night);color:var(--star);font-family:"Gowun Batang",serif;word-break:keep-all;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
[hidden]{display:none!important}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

/* 1막: 불 켜진 방 */
#room{position:fixed;inset:0;background:radial-gradient(120% 80% at 50% 0%,#fff3d6 0%,var(--warm) 45%,var(--warm2) 100%);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity 1.2s ease;z-index:5}
#room.off{opacity:0;pointer-events:none}
#room h1{font-size:clamp(24px,7vw,34px);font-weight:700;line-height:1.4;margin-top:12vh}
#room p{margin-top:14px;font-size:16px;opacity:.75}
#cord{position:absolute;top:0;left:50%;width:56px;margin-left:-28px;display:flex;flex-direction:column;align-items:center;cursor:grab;touch-action:none}
#cord .line{width:2px;height:14vh;background:#6b4d2e}
#cord .knob{width:26px;height:38px;border-radius:13px 13px 15px 15px;background:linear-gradient(#8a6038,#5d3e20);box-shadow:0 4px 10px rgba(0,0,0,.25)}
#cord.hint .knob{animation:sway 2.4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translateY(0)}50%{transform:translateY(10px)}}
.pull{margin-top:auto;margin-bottom:8vh;font-size:15px;opacity:.6}

/* 2막: 밤 */
#letter{position:fixed;left:0;right:0;top:58%;padding:0 24px;text-align:center;z-index:3;pointer-events:none}
#letter p{font-size:clamp(17px,4.6vw,21px);line-height:1.7;opacity:0;transform:translateY(8px);transition:opacity 1.6s ease,transform 1.6s ease;text-shadow:0 0 12px rgba(255,230,170,.35)}
#letter p.show{opacity:1;transform:none}
#letter .sign{margin-top:18px;font-size:15px;color:var(--soft)}
#hud{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));text-align:center;font-size:13px;color:rgba(255,247,224,.5);z-index:3;pointer-events:none;transition:opacity 1s}
#sheepCount{font-family:"Jua",sans-serif;font-size:16px;color:var(--soft);margin-bottom:6px;min-height:22px}
#mute{position:fixed;top:max(14px,env(safe-area-inset-top));right:14px;z-index:6;background:rgba(255,255,255,.08);border:0;color:var(--soft);width:40px;height:40px;border-radius:20px;font-size:18px}
#dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:4;transition:opacity 2s linear}

/* 링크 만들기 */
#make{position:fixed;inset:0;overflow:auto;background:#0b0d1c;z-index:10;padding:28px 16px 40px;touch-action:auto;user-select:text;-webkit-user-select:text}
#make .box{max-width:460px;margin:0 auto}
#make h2{font-size:24px;margin-bottom:6px}
#make .sub{color:var(--soft);font-size:14px;margin-bottom:22px}
#make label{display:block;font-size:14px;color:var(--soft);margin:16px 0 6px}
#make input,#make textarea{width:100%;font:16px/1.5 "Gowun Batang",serif;color:#fff;background:#161a33;border:1px solid #2a3060;border-radius:12px;padding:12px}
#make textarea{min-height:120px;resize:vertical}
#make .row{display:flex;gap:8px;margin-top:22px}
#make button{flex:1;font:600 16px "Gowun Batang",serif;border:0;border-radius:12px;padding:14px;background:#f6dcae;color:#3b2a1a}
#make button.ghost{background:#20254a;color:#fff}
#make .out{margin-top:14px;font-size:13px;color:var(--soft);word-break:break-all}
</style>
</head>
<body>
<canvas id="sky"></canvas>

<section id="room">
  <div id="cord" class="hint" aria-label="불 끄는 줄"><div class="line"></div><div class="knob"></div></div>
  <h1 id="roomTitle">이제 잘 시간이야</h1>
  <p>오늘 하루도 고생 많았어</p>
  <div class="pull">줄을 아래로 당겨서 불을 꺼줘</div>
</section>

<div id="letter"></div>
<div id="hud" hidden><div id="sheepCount"></div><span id="hint">화면을 쓸면 별똥별, 톡 누르면 양이 넘어가</span></div>
<button id="mute" hidden aria-label="소리 끄기">♪</button>
<div id="dim"></div>

<section id="make" hidden>
  <div class="box">
    <h2>잘 자 편지 만들기</h2>
    <p class="sub">적은 내용으로 링크가 만들어져. 그 링크를 보내주면 끝!</p>
    <label for="mTo">받는 사람 이름</label><input id="mTo" placeholder="예: 지은" maxlength="12">
    <label for="mFrom">보내는 사람 이름</label><input id="mFrom" placeholder="예: 민수" maxlength="12">
    <label for="mBig">별자리로 그릴 글자 (짧을수록 예뻐)</label><input id="mBig" value="잘 자" maxlength="6">
    <label for="mMsg">편지 (줄마다 한 문장씩 나타나)</label>
    <textarea id="mMsg">오늘 하루도 정말 수고했어
내일은 오늘보다 더 좋은 일만 있을 거야
꿈에서 만나</textarea>
    <div class="row"><button class="ghost" id="mPreview">미리보기</button><button id="mShare">링크 보내기</button></div>
    <p class="out" id="mOut"></p>
  </div>
</section>

<script>
(() => {
'use strict';
const qs = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);

// ---------- 링크 만들기 화면 ----------
function buildUrl() {
  const p = new URLSearchParams();
  const to = $('mTo').value.trim(), from = $('mFrom').value.trim(), big = $('mBig').value.trim(), msg = $('mMsg').value.trim();
  if (to) p.set('to', to);
  if (from) p.set('from', from);
  if (big && big !== '잘 자') p.set('big', big);
  if (msg) p.set('msg', msg);
  return location.origin + location.pathname + '?' + p.toString();
}
if (qs.has('make')) {
  $('make').hidden = false;
  $('mPreview').onclick = () => { location.href = buildUrl(); };
  $('mShare').onclick = async () => {
    const url = buildUrl();
    try {
      if (navigator.share) { await navigator.share({ title: '잘 자 🌙', text: '불 끄고 열어봐', url }); return; }
    } catch (e) { if (e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(url); $('mOut').textContent = '링크를 복사했어! 메신저에 붙여넣어 보내줘 → ' + url; }
    catch { $('mOut').textContent = url; }
  };
  return;
}

// ---------- 내용 ----------
const josa = name => { const c = name.charCodeAt(name.length - 1); return (c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28) ? '아' : '야'; };
const TO = (qs.get('to') || '').slice(0, 12);
const FROM = (qs.get('from') || '').slice(0, 12);
const BIG = (qs.get('big') || '잘 자').slice(0, 6);
const LINES = (qs.get('msg') || '오늘 하루도 정말 수고했어\n내일은 오늘보다 더 좋은 일만 있을 거야\n꿈에서 만나').split('\n').map(s => s.trim()).filter(Boolean).slice(0, 6);
if (TO) $('roomTitle').textContent = `${TO}${josa(TO)}, 이제 잘 시간이야`;

// ---------- 캔버스 ----------
const cv = $('sky'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (phase >= 2) layoutText();
}
const rand = (a, b) => a + Math.random() * (b - a);
let phase = 0;          // 0 방, 1 어둠, 2 별자리, 3 자유
let t0 = 0;
const bg = [];          // 배경 별
const ps = [];          // 글자 별
const shoots = [];      // 별똥별
const sheep = [];
let sheepN = 0;
let moonY = 0, moonC = null;

function initStars() {
  bg.length = 0;
  const n = Math.round(W * H / 2600);
  for (let i = 0; i < n; i++) bg.push({ x: Math.random(), y: Math.random() * .92, r: rand(.3, 1.3), tw: rand(.5, 2.2), ph: rand(0, 6.28), a: 0 });
}

function sampleText() {
  const oc = document.createElement('canvas');
  const fs = Math.min(W * (BIG.length <= 3 ? .34 : .9 / BIG.length * 1.6), 190);
  oc.width = W; oc.height = Math.ceil(fs * 1.5);
  const o = oc.getContext('2d');
  o.fillStyle = '#fff'; o.textAlign = 'center'; o.textBaseline = 'middle';
  o.font = `${fs}px Jua, "Gowun Batang", sans-serif`;
  o.fillText(BIG, W / 2, oc.height / 2);
  const d = o.getImageData(0, 0, oc.width, oc.height).data;
  let gap = Math.max(4, Math.round(fs / 22));
  const pts = [];
  for (let y = 0; y < oc.height; y += gap) for (let x = 0; x < oc.width; x += gap)
    if (d[(y * oc.width + x) * 4 + 3] > 140) pts.push([x + rand(-1, 1), y + rand(-1, 1)]);
  while (pts.length > 700) pts.splice(Math.floor(Math.random() * pts.length), 1);
  return { pts, h: oc.height };
}
function layoutText() {
  const { pts, h } = sampleText();
  const top = H * .33 - h / 2;
  pts.forEach((p, i) => {
    let q = ps[i];
    if (!q) { q = ps[i] = { x: rand(0, W), y: rand(0, H * .9), vx: 0, vy: 0, r: rand(.9, 2), ph: rand(0, 6.28), delay: rand(0, 1.6) }; }
    q.tx = p[0]; q.ty = p[1] + top;
  });
  ps.length = pts.length;
}

function drawSky(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#05060f'); g.addColorStop(.6, '#0b1030'); g.addColorStop(1, '#1a1840');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function drawMoon(t) {
  const target = H * .12;
  moonY += ((phase >= 3 ? target : H * .12 + 80) - moonY) * .02;
  const x = W * .82, y = moonY, r = Math.min(W, H) * .055 + 10;
  const a = Math.min(1, Math.max(0, (t - 3) / 3));
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  const glow = ctx.createRadialGradient(x, y, r * .5, x, y, r * 4);
  glow.addColorStop(0, 'rgba(255,236,190,.25)'); glow.addColorStop(1, 'rgba(255,236,190,0)');
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(x, y, r * 4, 0, 7); ctx.fill();
  if (!moonC || moonC.r !== r) { // 초승달은 따로 그려서 하늘이 뚫리지 않게
    moonC = document.createElement('canvas'); moonC.r = r; moonC.width = moonC.height = Math.ceil(r * 2 * DPR + 4);
    const m = moonC.getContext('2d'); m.scale(DPR, DPR);
    m.fillStyle = '#fff1c9'; m.beginPath(); m.arc(r + 1, r + 1, r, 0, 7); m.fill();
    m.globalCompositeOperation = 'destination-out'; m.beginPath(); m.arc(r + 1 + r * .45, r + 1 - r * .25, r * .9, 0, 7); m.fill();
  }
  ctx.drawImage(moonC, x - r - 1, y - r - 1, moonC.width / DPR, moonC.height / DPR);
  ctx.restore();
}
function drawBg(t, dt) {
  for (const s of bg) {
    s.a = Math.min(1, s.a + dt * rand(.05, .4));
    const a = s.a * (.55 + .45 * Math.sin(t * s.tw + s.ph));
    ctx.fillStyle = `rgba(255,247,224,${a})`;
    ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, 7); ctx.fill();
  }
}
function drawText(t, dt, el) {
  for (const p of ps) {
    if (el > p.delay) {
      const k = Math.min(1, dt * 2.2);
      p.vx += (p.tx - p.x) * k * 1.4; p.vy += (p.ty - p.y) * k * 1.4;
      p.vx *= .82; p.vy *= .82;
      p.x += p.vx * dt * 2.2; p.y += p.vy * dt * 2.2;
    }
    const tw = .6 + .4 * Math.sin(t * 2.4 + p.ph);
    ctx.fillStyle = `rgba(255,240,200,${tw})`;
    ctx.shadowColor = 'rgba(255,220,150,.9)'; ctx.shadowBlur = 6;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
  }
  ctx.shadowBlur = 0;
}
function spawnShoot(x, y, dx, dy) {
  const m = Math.hypot(dx, dy) || 1;
  shoots.push({ x, y, dx: dx / m, dy: dy / m, v: rand(700, 1100), life: 1 });
}
function drawShoots(dt) {
  for (let i = shoots.length - 1; i >= 0; i--) {
    const s = shoots[i];
    s.x += s.dx * s.v * dt; s.y += s.dy * s.v * dt; s.life -= dt * .9;
    if (s.life <= 0) { shoots.splice(i, 1); continue; }
    const len = 140;
    const g = ctx.createLinearGradient(s.x, s.y, s.x - s.dx * len, s.y - s.dy * len);
    g.addColorStop(0, `rgba(255,250,230,${s.life})`); g.addColorStop(1, 'rgba(255,250,230,0)');
    ctx.strokeStyle = g; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.dx * len, s.y - s.dy * len); ctx.stroke();
  }
}
function drawSheep(dt) {
  const ground = H - 70;
  ctx.strokeStyle = 'rgba(255,247,224,.25)'; ctx.lineWidth = 2;
  if (sheep.length || sheepN) { // 울타리
    const fx = W / 2;
    ctx.beginPath(); ctx.moveTo(fx - 22, ground); ctx.lineTo(fx - 22, ground - 26); ctx.moveTo(fx + 22, ground); ctx.lineTo(fx + 22, ground - 26);
    ctx.moveTo(fx - 30, ground - 10); ctx.lineTo(fx + 30, ground - 10); ctx.moveTo(fx - 30, ground - 20); ctx.lineTo(fx + 30, ground - 20); ctx.stroke();
  }
  ctx.font = '34px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  for (let i = sheep.length - 1; i >= 0; i--) {
    const s = sheep[i];
    s.x -= dt * 150;
    const u = (W / 2 + 90 - s.x) / 180; // 울타리 앞뒤 180px 구간에서 점프
    const jump = u > 0 && u < 1 ? Math.sin(u * Math.PI) * 70 : 0;
    if (!s.counted && s.x < W / 2) { s.counted = true; sheepN++; $('sheepCount').textContent = `양 ${sheepN}마리…`; }
    if (s.x < -40) { sheep.splice(i, 1); continue; }
    ctx.fillText('🐑', s.x, ground - jump);
  }
}

let last = 0;
function frame(now) {
  const t = now / 1000, dt = Math.min(.05, t - (last || t)); last = t;
  const el = t - t0;
  drawSky(t);
  if (phase >= 1) { drawBg(t, dt); drawMoon(el); }
  if (phase >= 2) drawText(t, dt, el - 2.2);
  drawShoots(dt);
  if (phase >= 3) drawSheep(dt);
  if (phase >= 3 && Math.random() < dt * .08) spawnShoot(rand(W * .2, W), rand(0, H * .3), -1, rand(.3, .7));
  requestAnimationFrame(frame);
}

// ---------- 오르골 (WebAudio로 직접 만든 자장가) ----------
let ac = null, master = null, muted = false, musicTimer = null;
const NOTES = { C4: 261.6, D4: 293.7, E4: 329.6, F4: 349.2, G4: 392, A4: 440, B4: 493.9, C5: 523.3, D5: 587.3, E5: 659.3, G5: 784 };
const SONG = [['E5',1],['C5',1],['G4',2],['A4',1],['C5',1],['G4',2],['E4',1],['G4',1],['C5',1],['D5',1],['E5',2],['D5',2],
              ['E5',1],['G5',1],['E5',2],['D5',1],['C5',1],['A4',2],['G4',1],['A4',1],['C5',1],['D5',1],['C5',4]];
function pling(freq, when, dur) {
  for (const [mul, vol] of [[1, .18], [2, .05], [3, .02]]) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.value = freq * mul;
    g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(vol, when + .01);
    g.gain.exponentialRampToValueAtTime(.0001, when + dur + 1.2);
    o.connect(g).connect(master); o.start(when); o.stop(when + dur + 1.3);
  }
}
function playSong() {
  const beat = .42; let at = ac.currentTime + .1;
  for (const [n, b] of SONG) { pling(NOTES[n], at, b * beat); at += b * beat; }
  musicTimer = setTimeout(playSong, (at - ac.currentTime + 2.5) * 1000);
}
function click() {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'square'; o.frequency.setValueAtTime(180, ac.currentTime); o.frequency.exponentialRampToValueAtTime(60, ac.currentTime + .05);
  g.gain.setValueAtTime(.12, ac.currentTime); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + .08);
  o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + .1);
}
function startAudio() {
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = .9; master.connect(ac.destination);
    click(); setTimeout(playSong, 2200);
  } catch {}
}
$('mute').onclick = e => {
  e.stopPropagation(); muted = !muted;
  if (master) master.gain.setTargetAtTime(muted ? 0 : .9, ac.currentTime, .1);
  $('mute').textContent = muted ? '✕' : '♪';
};

// ---------- 1막: 줄 당기기 ----------
const cord = $('cord');
let pulling = false, sy = 0, pulled = 0;
cord.addEventListener('pointerdown', e => { pulling = true; sy = e.clientY; cord.classList.remove('hint'); cord.setPointerCapture(e.pointerId); });
cord.addEventListener('pointermove', e => {
  if (!pulling) return;
  pulled = Math.max(0, Math.min(120, e.clientY - sy));
  cord.style.transform = `translateY(${pulled}px)`;
});
cord.addEventListener('pointerup', () => {
  if (!pulling) return; pulling = false;
  cord.style.transition = 'transform .35s cubic-bezier(.3,1.6,.5,1)'; cord.style.transform = '';
  setTimeout(() => cord.style.transition = '', 400);
  if (pulled > 50) lightsOff(); else if (pulled < 6) lightsOff(); // 그냥 탭해도 OK
  pulled = 0;
});

async function lightsOff() {
  if (phase) return;
  phase = 1; t0 = performance.now() / 1000;
  startAudio();
  if (navigator.vibrate) navigator.vibrate(15);
  $('room').classList.add('off');
  $('mute').hidden = false;
  initStars();
  moonY = H * .12 + 80;
  try { await document.fonts.load(`100px Jua`); } catch {}
  setTimeout(() => { phase = 2; layoutText(); }, 1800);
  // 편지 한 줄씩
  const box = $('letter');
  const lines = LINES.map(s => { const p = document.createElement('p'); p.textContent = s; box.appendChild(p); return p; });
  if (FROM) { const p = document.createElement('p'); p.className = 'sign'; p.textContent = `— ${FROM}${josa(FROM) === '아' ? '이가' : '가'}`; box.appendChild(p); lines.push(p); }
  lines.forEach((p, i) => setTimeout(() => p.classList.add('show'), 5200 + i * 2600));
  setTimeout(() => { phase = 3; $('hud').hidden = false; scheduleDim(); }, 5200 + lines.length * 2600);
}

// ---------- 3막: 별똥별·양 ----------
let down = null;
addEventListener('pointerdown', e => { if (phase >= 2) down = { x: e.clientX, y: e.clientY, t: performance.now() }; wake(); });
addEventListener('pointerup', e => {
  if (!down || phase < 2) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y, dist = Math.hypot(dx, dy);
  if (dist > 40) spawnShoot(e.clientX, e.clientY, dx, dy);
  else if (phase >= 3) { sheep.push({ x: W + 30, counted: false }); if (ac && !muted) pling(NOTES.G5, ac.currentTime, .2); }
  down = null;
});

// ---------- 잠드는 동안 화면이 천천히 어두워짐 ----------
let dimTimer = null;
function scheduleDim() {
  clearTimeout(dimTimer);
  dimTimer = setTimeout(() => { $('dim').style.transition = 'opacity 40s linear'; $('dim').style.opacity = '.88'; $('hud').style.opacity = 0; }, 25000);
}
function wake() {
  if (phase < 3) return;
  $('dim').style.transition = 'opacity .6s'; $('dim').style.opacity = '0'; $('hud').style.opacity = 1;
  scheduleDim();
}

addEventListener('resize', resize);
resize(); initStars();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
